site_name: N-Body Simulator
site_description: 3D N-body physics engine in Python.
site_author: Rafał Oszajca

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: cyan
  features:
    - navigation.sections
    - navigation.top

nav:
  - Home: index.md
  - API Reference:
      - Simulation: api/simulation.md
      - Renderers: api/renderers.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences