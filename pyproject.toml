[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody-sim"
dynamic = ["version"]
description = "A high-performance, 2D N-body physics simulation in pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "numpy>=1.22.0",
    "numba>=0.57.0",
    "pint>=0.22"
]

[project.optional-dependencies]
# Install these using `pip install -e .[dev]`
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "jupyter>=1.0",
    "matplotlib>=3.7" # For visualizing the demo notebook
]

[tool.setuptools_scm]
# This enables automated git-coupled versioning
write_to = "src/nbody_sim/_version.py"

[tool.pytest.ini_options]
# Default pytest flags: run coverage on the src directory
addopts = "--cov=src/nbody_sim --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]