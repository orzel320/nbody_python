[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbody-sim-RO"
dynamic = ["version"]
description = "N-body physics simulation in Python."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "orzel320", email = "orzellll320@gmail.com"}
]
dependencies = [
    "numpy>=1.22.0",
    "numba>=0.57.0",
    "pint>=0.22"
]

[project.optional-dependencies]
vis = [
    "matplotlib>=3.10.8",
    "ipympl>=0.9.3",
    "k3d>=2.16.0",
    "jupyter>=1.1.1"
]

test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0"
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6"
]

dev = [
    "nbody-sim[vis,test,docs]"
]

[tool.setuptools_scm]
write_to = "src/nbody_sim/_version.py"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
addopts = "--cov=src/nbody_sim --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]